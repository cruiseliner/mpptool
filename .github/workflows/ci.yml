name: CI
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --all-targets
      - run: cargo test --locked

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo build --locked --no-default-features

  corpus:
    # Real-world files from MPXJ's test suite (LGPL; fetched at CI time, never committed).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libxml2-utils jq
      - run: scripts/fetch-corpus.sh
      - run: cargo build --release --locked
      - run: MPXJ_DATA=$PWD/corpus/mpxj/junit/data cargo test --release --locked --test cli
      - name: Full corpus round-trip
        run: |
          scripts/test-corpus.sh | tee corpus.txt
          grep -q "xml_not_wellformed=0 roundtrip_mismatch=0" corpus.txt
